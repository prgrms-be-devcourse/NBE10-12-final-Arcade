# 루트 Compose와 합쳐 선택적으로 실행하는 모니터링 스택이다.

services:
  # Grafana는 하위 경로 대신 별도 8081 포트를 쓴다.
  caddy:
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${MONITORING_HTTP_PORT:-8081}:8081"

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    # 호스트 포트는 루프백에만 열고 보존 기간을 짧게 둔다.
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --web.enable-lifecycle
      # external-url이 /prometheus 경로와 리다이렉트를 함께 맞춘다.
      - --web.external-url=${PROMETHEUS_EXTERNAL_URL:?PROMETHEUS_EXTERNAL_URL is required}
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-256m}
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/prometheus/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx-exporter:
    profiles: ["monitoring"]
    image: nginx/nginx-prometheus-exporter:1.5.3
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    environment:
      GOMEMLIMIT: ${NGINX_EXPORTER_GOMEMLIMIT:-48MiB}
    mem_limit: ${NGINX_EXPORTER_MEM_LIMIT:-64m}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres-exporter:
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      # 애플리케이션 DB 계정 대신 pg_monitor 권한만 가진 전용 계정을 쓴다.
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:-postgres_exporter}
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?POSTGRES_EXPORTER_PASSWORD is required}
      GOMEMLIMIT: ${POSTGRES_EXPORTER_GOMEMLIMIT:-48MiB}
    mem_limit: ${POSTGRES_EXPORTER_MEM_LIMIT:-64m}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy

  # 수집과 열람 프로필을 독립적으로 켠다.
  grafana:
    profiles: ["grafana"]
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      # 서버에서는 반드시 덮어쓴다.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # 익명 열람은 로컬에서만 켠다.
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_AUTH_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GOMEMLIMIT: ${GRAFANA_GOMEMLIMIT:-320MiB}
      # route-prefix를 포함한 데이터소스 주소다.
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090/prometheus}
    # GOMEMLIMIT보다 여유 있는 컨테이너 상한이다.
    mem_limit: ${GRAFANA_MEM_LIMIT:-384m}
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1",
        ]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  prometheus-data:
  grafana-data:
