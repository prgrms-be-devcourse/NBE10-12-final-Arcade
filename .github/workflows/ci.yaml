name: CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "back/**"
      - "front/**"
      - ".github/workflows/ci.yaml"
  push:
    branches: [main, develop]
    paths:
      - "back/**"
      - "front/**"
      - ".github/workflows/ci.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'back/**'
            frontend:
              - 'front/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    permissions: { pull-requests: write, contents: read, issues: write }
    timeout-minutes: 10
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: jacoco coverage
        run: ./gradlew check

      - name: Comment coverage table
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('child_process');

            const MARKER = '<!-- backend-coverage-table -->';
            const table = execFileSync('python3', [
              '.github/scripts/coverage_table.py',
              'back/build/reports/jacoco/test/jacocoTestReport.xml',
            ]).toString();

            const sha = context.payload.pull_request.head.sha;
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const when = new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });

            const body = `${MARKER}\n## 📊 백엔드 커버리지\n\n${table}\n`
              + `\n> 라인 80% · 브랜치 70% 기준. 낮은 패키지가 위에 옵니다.\n`
              + `>\n`
              + `> 기준 커밋 [\`${sha.slice(0, 7)}\`](https://github.com/${repo}/commit/${sha})`
              + ` · [실행 로그](https://github.com/${repo}/actions/runs/${context.runId})`
              + ` · ${when} 갱신`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # 어떤 테스트가 깨졌는지 보는 용도
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-report
          path: back/build/reports/tests/test/
          retention-days: 1

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: "11"
          runtime: node@22
          cache: true
          cache-dependency-path: front/pnpm-lock.yaml
          package-json-file: front/package.json
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: front

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: front/.next/cache
          key: next-${{ hashFiles('front/pnpm-lock.yaml') }}-${{ hashFiles('front/**/*.[jt]s', 'front/**/*.[jt]sx') }}
          restore-keys: |
            next-${{ hashFiles('front/pnpm-lock.yaml') }}-
            next-

      - name: Lint
        run: pnpm exec eslint .

      - name: Type check
        run: |
          pnpm exec next typegen
          pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
