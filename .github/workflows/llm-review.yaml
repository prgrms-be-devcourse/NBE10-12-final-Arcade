name: PR Agent
on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.svg"
      - "**/*.ico"
      - "**/*.pdf"
      - "docs/**"
      - ".github/**"
      - ".githooks/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.sender.type != 'Bot' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get Filtered Diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE_SHA...$HEAD_SHA" -- . \
            ':(exclude)*.lock' \
            ':(exclude)package-lock.json' \
            ':(exclude)yarn.lock' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)*.png' \
            ':(exclude)*.jpg' \
            ':(exclude)*.jpeg' \
            ':(exclude)*.svg' \
            ':(exclude)*.ico' \
            ':(exclude)*.pdf' \
            ':(exclude)back/build/*' \
            ':(exclude)back/target/*' \
            ':(exclude)back/.gradle/*' \
            ':(exclude)back/out/*' \
            ':(exclude)back/.idea/*' \
            ':(exclude)back/gradle/*' \
            ':(exclude)back/gradlew' \
            ':(exclude)back/gradlew.bat' \
            ':(exclude)back/node_modules/*' \
            ':(exclude)front/node_modules/*' \
            ':(exclude)front/.pnpm-store/*' \
            ':(exclude)front/dist/*' \
            ':(exclude)front/build/*' \
            ':(exclude)front/.next/*' \
            ':(exclude)front/.turbo/*' \
            ':(exclude)node_modules/*' \
            ':(exclude).pnpm-store/*' \
            ':(exclude)docs/**' \
            > diff.txt
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install google-genai
      - name: Run Gemini Review
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python .github/scripts/ai_review.py
