server:
  forward-headers-strategy: native
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  config:
    import: optional:file:.env[.properties]
  application:
    name: back
  profiles:
    default: dev
    group:
      local: compose
      prod: compose
  docker:
    compose:
      enabled: false
  output:
    ansi:
      enabled: always
  datasource:
    hikari:
      auto-commit: false
  flyway:
    # 기존 환경(ddl-auto로 만들어진 스키마)에는 스키마 히스토리 테이블이 없다.
    # baseline-on-migrate로 에러 없이 현재 상태를 baseline-version까지 끝난
    # 것으로 간주하게 한다. V1(baseline)이 전체 스키마를 만드는 스크립트라,
    # 이미 테이블이 있는 기존 환경은 V1을 건너뛰고 V2부터 적용한다.
    # 완전히 빈 새 환경은 V1부터 실제로 전체 스키마를 만든다.
    baseline-on-migrate: true
    baseline-version: "1"
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__GITHUB__CLIENT_ID}
            client-secret: ${SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__GITHUB__CLIENT_SECRET}
            client-name: Github
            scope: read:user, user:email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            user-name-attribute: id
springdoc:
  default-produces-media-type: application/json;charset=UTF-8
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
custom:
  frontend:
    base-url: ${CUSTOM__FRONTEND__BASE_URL:/}
  jwt:
    secretKey: ${CUSTOM__JWT__SECRET_KEY:abcdefghijklmnopqrstuvwxyz1234567890abcdefghijklmnopqrstuvwxyz1234567890abcdefghijklmnopqrstuvwxyz1234567890}
  accessToken:
    expirationSeconds: ${CUSTOM__ACCESS_TOKEN__EXPIRATION_SECONDS:900}
  github:
    app:
      id: ${CUSTOM__GITHUB__APP__ID:}
      slug: ${CUSTOM__GITHUB__APP__SLUG:}
      privateKey: ${CUSTOM__GITHUB__APP__PRIVATE_KEY:}
      clientId: ${CUSTOM__GITHUB__APP__CLIENT_ID:}
      clientSecret: ${CUSTOM__GITHUB__APP__CLIENT_SECRET:}
      userAuthorizationCallbackUrl: ${CUSTOM__GITHUB__APP__USER_AUTHORIZATION_CALLBACK_URL:}
      tokenEncryptionKey: ${CUSTOM__GITHUB__APP__TOKEN_ENCRYPTION_KEY:}
    webhook:
      secret: ${CUSTOM__GITHUB__WEBHOOK__SECRET:}
  storage:
    # local = 서버 디스크. MinIO 없이 개발할 때 쓴다. s3 = S3/MinIO.
    type: ${CUSTOM__STORAGE__TYPE:local}
    max-file-size: 5MB
    local:
      path: ${CUSTOM__STORAGE__LOCAL__PATH:.uploads}
      url-prefix: /uploads
    s3:
      endpoint: ${CUSTOM__STORAGE__S3__ENDPOINT:http://localhost:9000}
      region: ${CUSTOM__STORAGE__S3__REGION:us-east-1}
      bucket: ${CUSTOM__STORAGE__S3__BUCKET:arcade}
      access-key: ${CUSTOM__STORAGE__S3__ACCESS_KEY:arcade}
      secret-key: ${CUSTOM__STORAGE__S3__SECRET_KEY:arcade123}
      public-url-prefix: ${CUSTOM__STORAGE__S3__PUBLIC_URL_PREFIX:}
      path-style-access: ${CUSTOM__STORAGE__S3__PATH_STYLE_ACCESS:true}
  notProdMembers:
