      apiKey: kakao__1
      nickname: 장희성
      profileImgUrl: http://img1.kakaocdn.net/thumb/R640x640.q70/?fname=http://t1.kakaocdn.net/account_images/default_profile.jpeg
    - username: GOOGLE__103240209825008011930
