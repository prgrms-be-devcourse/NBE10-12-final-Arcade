spring:
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop
      stop:
        command: down
  datasource:
    url: jdbc:h2:./db_dev;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
logging:
  level:
    com.back: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE
custom:
  cookie:
    secure: false
    same-site: Lax
  cors:
    allowed-origins: http://localhost:3000,https://cdpn.io
  openapi:
    api-docs-url: ${CUSTOM__OPENAPI__API_DOCS_URL:http://localhost:${SERVER_PORT:8080}/v3/api-docs/apiV1}
  curation:
    enabled: ${CUSTOM__CURATION__ENABLED:true}
    model: ${CUSTOM__CURATION__MODEL:gemini-3.6-flash}
    batch-cron: ${CUSTOM__CURATION__BATCH_CRON:0 0 3 * * *}
    candidate-limit: ${CUSTOM__CURATION__CANDIDATE_LIMIT:15}
    gemini:
      api-key: ${CUSTOM__CURATION__GEMINI__API_KEY:}

