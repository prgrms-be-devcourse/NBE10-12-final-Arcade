spring:
  datasource:
    url: jdbc:h2:mem:db_test;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # Flyway가 V1(baseline)로 스키마를 만들고 Hibernate는 검증만 한다.
      ddl-auto: validate
custom:
  cookie:
    secure: false
    same-site: Strict
  cors:
    allowed-origins: http://localhost:3000
  notification:
    redis-pubsub:
      enabled: false
  storage:
    local:
      path: build/test-uploads
