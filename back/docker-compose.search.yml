services:
  search-postgres:
    image: postgres:16
    container_name: crewon-search-postgres
    environment:
      POSTGRES_DB: crewon_search
      POSTGRES_USER: crewon
      POSTGRES_PASSWORD: crewon
    ports:
      - "5433:5432"
    volumes:
      - search-postgres-data:/var/lib/postgresql/data

volumes:
  search-postgres-data:
